<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/icon.png" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <title>Nickshan J — Full Stack Developer</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        background: #020207;
        color: #c8ccd6;
        font-family: 'Space Grotesk', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      /* Only Projects page allows scroll */
      body.allow-scroll { overflow-y: auto; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #020207; }
      ::-webkit-scrollbar-thumb { background: #00D4FF; border-radius: 4px; }
      ::selection { background: rgba(0,212,255,0.25); color: #fff; }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
